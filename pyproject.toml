[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-agent"
version = "0.1.0"
description = "Local VRChat agent foundations with fail-closed OSC control"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3", "python-osc>=1.9,<2", "Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vrc-agent = "vrc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vrc_agent.planner" = ["fixtures/*.json"]
"vrc_agent.skills" = ["worlds/*.json", "worlds/*.sha256"]
"vrc_agent.live_navigation" = ["*.json", "*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
