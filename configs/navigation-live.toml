# 现场 live 配置（用户选定：云端 DeepSeek，2026-10-16）。
# 密钥只在本机环境变量 DEEPSEEK_API_KEY（User 级已设置），不写进本文件、日志或报告。
#
# 2026-10-17 第 54 节现场证据：思考开启且 max_tokens=1024 时 6/7 空 content；
# 本次显式禁用思考，保持输出额度；禁用后现场记录为 7/7 返回、2.6–8.3s。
# 第71/72节新增v6预算候选（复用v5判据）；第96节 v8 已机械冻结，本文件显式选择 v8。
# 默认仍 dry-run；live 需显式模式/授权/本机F9，20次任务按第93节人工确认到达。
# 真实输入仍需显式live、图像/付费/标定授权与本机F9；冻结不代表20次任务验收。
# 第64/66节改为JPEG q85上传，8000ms预算不变；生产同款时延须现场复测。

mode = "dry-run"
navigation_design = "stable-inference-v8"
navigation_motion_profile = "field"
provider = "fake"

[control]
enable_motion_probe = false
window_title = "VRChat"
lease_ms = 30000
lease_extension_ms = 30000
lease_extension_max = 5
observation_max_age_ms = 4000

[capture]
window_class = "UnityWndClass"
window_match = "exact"
require_unoccluded = true
require_dpi_awareness = true

[perception]
disable_thinking = true
provider = "openai_compat"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
budget_usd = 1.0
timeout_ms = 20000
max_retries = 0
send_images = true
image_format = "jpeg"
jpeg_quality = 85
# 价格表：保守取峰值价（非峰值时段实际扣费约为一半；cache hit 输入更低，均不用）。
# 来源 api-docs.deepseek.com/quick_start/pricing，2026-10-16 查阅；仅本地估算口径，
# 不是供应商账单。
price_input_per_mtok_usd = 0.30
price_output_per_mtok_usd = 1.20
price_as_of = "2026-10-16"
