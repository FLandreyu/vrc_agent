# 默认不会向网络或 VRChat 发送任何输入。
mode = "dry-run"
provider = "fake"

[osc]
host = "127.0.0.1"
send_port = 9000
receive_port = 9001

[control]
tick_hz = 50
max_motion_ms = 500
heartbeat_interval_ms = 100
heartbeat_timeout_ms = 500
observation_max_age_ms = 1500
lease_ms = 30000
chat_interval_ms = 2000
max_actions_per_session = 10000
window_title = "VRChat"
# 人工探针默认禁用；实机探针测试使用 configs/probe.toml（现场显式配置）。
enable_motion_probe = false

# 窗口采集（T04）。默认值与 CaptureConfig 一致；省略 window_title 时继承 control.window_title。
[capture]
# 只在需要改标题时取消注释；window_title 优先于 control.window_title。
# window_title = "VRChat"
window_class = "UnityWndClass"
# "exact"（完全相等）或 "contains"（包含子串）。
window_match = "exact"
# 本机实测：非 per-monitor DPI 感知的进程会拿到被系统缩放的错误分辨率画面（150% 缩放下 2160x1440 被虚拟化成 1440x960）。
require_dpi_awareness = true
# 本机实测：BitBlt 读的是屏幕，被遮挡时会静默返回遮挡窗口的像素，所以遮挡检查是必需项而不是可选项。
require_unoccluded = true
# 每轴采样点数，实际检查 samples × samples 个网格点（5 → 25 点）。
occlusion_samples = 5
# 覆盖比例低于该值时判为 WINDOW_OCCLUDED；1.0 表示必须全部命中。
occlusion_min_ratio = 1.0
detect_black_frames = true
# 三个颜色通道的最大值都不超过该值即判为黑帧（GDI 未定义的 alpha 通道不参与）。
black_max_channel = 8
max_width = 3840
max_height = 2160
max_pixels = 8294400
# 帧只留在内存；为 false 时观测不带 frame_ref（帧仍不解码、不落盘）。
retain_frames = true
frames_in_memory = 8

# 感知与模型供应商（T05）。默认是离线假模型：免费、确定性、不出网。
# 配置里永远不放密钥，只放环境变量名；密钥只在发请求时从环境读入内存。
[perception]
provider = "fake"
model = "fake-scene-v1"
# 离线故障注入（只对假模型有效）：ok / garbage / error / timeout / refused / cancelled。
fake_behaviour = "ok"
timeout_ms = 20000
max_retries = 1
backoff_ms = 200
max_output_tokens = 1024
temperature = 0.0
json_mode = true
# 默认不把画面发给供应商；开启前必须由本机用户明确决定。
send_images = false
# 付费预算（美元）。0 表示不启用付费供应商——把 provider 改成 openai_compat 而不给预算会直接加载失败。
budget_usd = 0.0
# 价格表：两项必须同时给出，并且必须声明生效日期；缺价格时费用记为 unknown，不显示为 0。
price_currency = "USD"
# 价格生效日期（YYYY-MM-DD）。T10 起必填：没有日期的价格会算出「看起来准确、其实是猜的」
# 金额，所以「配了价格却没写日期」或「日期不是真实日期」都会在加载配置时直接失败。
# price_as_of = "2026-10-01"
# 观测超过该年龄就拒绝解读，直接给「未知」场景（0 表示不做年龄检查）。
max_observation_age_ms = 1500
max_scene_entities = 64

# 切到真实供应商时把上面的 provider 改成 "openai_compat"，并同时提供：
#   budget_usd = 1.0            # 必填，且 > 0
#   api_key_env = "OPENAI_API_KEY"   # 只写变量名，别把密钥写进本文件
#   base_url = "https://api.openai.com/v1"
#   price_input_per_mtok_usd / price_output_per_mtok_usd  # 可选，本地估算用；必须同时给 price_as_of
# 真实供应商冒烟测试要显式确认：vrc-agent perceive --provider openai_compat --allow-paid

# T00 参数接收实测：VRChat 内置手势参数（本地值域校验 0-7，实际以客户端为准）。
[osc.avatar_parameters.GestureLeft]
type = "int"
minimum = 0
maximum = 7
reset_value = 0

[osc.avatar_parameters.GestureRight]
type = "int"
minimum = 0
maximum = 7
reset_value = 0

# 按实际 Avatar 修改并取消注释；不要假设所有 Avatar 都包含此参数。
# [osc.avatar_parameters.Happy]
# type = "bool"
# reset_value = false

# 交流（T07）。默认 enabled = false：不打开任何音频设备、不播放任何声音。
# 设备用**名字子串**选择（索引会随驱动插拔变化）；省略表示取该方向的第一台可用设备。
[dialogue]
enabled = false
# 只发到虚拟输入（Voicemeeter 的 Input/AUX），让 VRChat 的麦克风听到；不直接对扬声器说话。
# output_device = "Voicemeeter Input"
# 监听侧建议用 Voicemeeter 的 B1/B2 监听总线，避免把本机扬声器的回声当成用户说话。
# input_device = "Voicemeeter Out B1"
sample_rate = 48000
playback_channels = 1
capture_channels = 1
# 一个音频块的长度＝「本机停止」能生效的最坏延迟。
block_ms = 20
# 队列：限长、到期即弃、两次发言之间的最小间隔（控制层还会再拦一次 RATE_LIMITED）。
max_pending = 8
queue_ttl_ms = 20000
min_interval_ms = 2000
max_utterance_ms = 15000
listen_ms = 300
turns = 20
# 首版半双工：AI 播放时门控监听，不识别自己的声音。
gate_while_speaking = true
vad_threshold = 0.01
# 自声回流诊断：放一段 880 Hz 的探针音并同时录音，看录到的比例够不够。
echo_tone_hz = 880.0
echo_probe_ms = 300
echo_amplitude = 0.08
echo_min_ratio = 0.25
echo_min_rms = 0.002
# 离线合成/识别。真实引擎（Piper/SAPI/Whisper 等）属于运行说明里的用户可执行步骤，不在这里安装。
tts = "fake"
asr = "fake"

# 真机音频冒烟（会真的打开设备并出声，务必先确认路由）：
#   vrc-agent dialogue --devices
#   vrc-agent dialogue --live-audio --output-device "Voicemeeter Input" --input-device "Voicemeeter Out B1" --scenario echo
# 本机停止（另开一个终端）会立即中断播放：
#   vrc-agent stop
